<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>シフト管理</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBlIqB0qzvsJ9lULl-jjEKpx5bX6tdfMLY",
  authDomain:"day-member.firebaseapp.com",
  projectId:"day-member",
  storageBucket:"day-member.firebasestorage.app",
  messagingSenderId:"416564334116",
  appId:"1:416564334116:web:73cd49e279a2ce421e12b1",
  measurementId:"G-V3YKYNYYHL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, "member11");
const DATA_DOC = doc(db, "shiftapp", "data");

let S = { members:[], roles:[], shifts:{}, weekOffset:0, sumWeekOffset:0, selectedDate:null, openCL:{}, openSumDay:{} };
let currentUser = null;
let isAdmin = false;
let unsubscribe = null;
window.pendingRemove = {};
window.sumPendingRemove = {};

async function fetchUserInfo(uid) {
  const snap = await getDoc(doc(db, "shiftapp_users", uid));
  return snap.exists() ? snap.data() : null;
}

function startSync() {
  if (unsubscribe) unsubscribe();
  unsubscribe = onSnapshot(DATA_DOC, function(snap) {
    if (snap.exists()) {
      const d = snap.data();
      const raw = d.members || [];
      S.members = raw.map(function(m) { return typeof m === "string" ? {name:m, roles:[]} : m; });
      S.roles = d.roles || [];
      S.shifts = d.shifts || {};
      // 旧フィールド名 __memo__ を note に移行
      Object.keys(S.shifts).forEach(function(dateKey) {
        const s = S.shifts[dateKey];
        if (s && s["__memo__"] !== undefined) {
          s["note"] = s["__memo__"];
          delete s["__memo__"];
        }
      });
    }
    renderWeek();
    renderMembers();
    renderRoles();
    if (document.getElementById("tab-summary").classList.contains("active")) renderSummary();
  });
}

window.saveData = async function() {
  try { await setDoc(DATA_DOC, {members:S.members, roles:S.roles, shifts:S.shifts}); }
  catch(e) { showToast("保存に失敗しました"); }
};

onAuthStateChanged(auth, async function(user) {
  if (user) {
    currentUser = user;
    const info = await fetchUserInfo(user.uid);
    if (info && info.mustChangePassword) {
      showScreen("password-setup");
      document.getElementById("setup-name").textContent = info.displayName || user.email;
      return;
    }
    isAdmin = info ? info.role === "admin" : false;
    showScreen("app");
    document.getElementById("user-name-label").textContent = info ? (info.displayName || user.email) : user.email;
    document.getElementById("admin-badge").style.display = isAdmin ? "inline-block" : "none";
    applyPermissions();
    startSync();
  } else {
    currentUser = null; isAdmin = false;
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    showScreen("login");
  }
});

function showScreen(name) {
  ["login","password-setup","app"].forEach(function(s) {
    document.getElementById("screen-" + s).style.display = s === name ? "flex" : "none";
  });
}

function applyPermissions() {
  document.querySelectorAll(".admin-only").forEach(function(el) {
    el.style.display = isAdmin ? "" : "none";
  });
  document.getElementById("nav-members").style.display = isAdmin ? "flex" : "none";
  document.getElementById("nav-roles").style.display = isAdmin ? "flex" : "none";
}

window.doLogin = async function() {
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  const err = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  err.textContent = ""; btn.disabled = true; btn.textContent = "確認中...";
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e) { err.textContent = "メールアドレスまたはパスワードが違います"; btn.disabled = false; btn.textContent = "ログイン"; }
};

window.loginKeydown = function(e) { if (e.key === "Enter") window.doLogin(); };

window.doSetupPassword = async function() {
  const np = document.getElementById("setup-new-pass").value;
  const np2 = document.getElementById("setup-confirm-pass").value;
  const err = document.getElementById("setup-error");
  err.textContent = "";
  if (np.length < 8) { err.textContent = "パスワードは8文字以上にしてください"; return; }
  if (np !== np2) { err.textContent = "パスワードが一致しません"; return; }
  try {
    await updatePassword(currentUser, np);
    await setDoc(doc(db, "shiftapp_users", currentUser.uid), {mustChangePassword: false}, {merge: true});
    showToast("パスワードを設定しました");
    const info = await fetchUserInfo(currentUser.uid);
    isAdmin = info ? info.role === "admin" : false;
    showScreen("app");
    document.getElementById("user-name-label").textContent = info ? (info.displayName || currentUser.email) : currentUser.email;
    document.getElementById("admin-badge").style.display = isAdmin ? "inline-block" : "none";
    applyPermissions(); startSync();
  } catch(e) { err.textContent = "エラーが発生しました。再度ログインしてください。"; }
};

window.setupKeydown = function(e) { if (e.key === "Enter") window.doSetupPassword(); };

window.doLogout = async function() {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  await signOut(auth);
};

// ---- 祝日 ----
const HOLIDAYS = {
  "2025-01-01":"元日","2025-01-13":"成人の日","2025-02-11":"建国記念の日","2025-02-12":"建国記念の日 振替","2025-02-23":"天皇誕生日","2025-02-24":"天皇誕生日 振替","2025-03-20":"春分の日","2025-04-29":"昭和の日","2025-05-03":"憲法記念日","2025-05-04":"みどりの日","2025-05-05":"こどもの日","2025-05-06":"こどもの日 振替","2025-07-21":"海の日","2025-08-11":"山の日","2025-09-15":"敬老の日","2025-09-23":"秋分の日","2025-10-13":"スポーツの日","2025-11-03":"文化の日","2025-11-23":"勤労感謝の日","2025-11-24":"勤労感謝の日 振替",
  "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日","2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日","2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日","2026-05-06":"こどもの日 振替","2026-07-20":"海の日","2026-08-11":"山の日","2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日","2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
  "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日","2027-04-29":"昭和の日","2027-05-03":"憲法記念日","2027-05-04":"みどりの日","2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日","2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日","2027-11-03":"文化の日","2027-11-23":"勤労感謝の日"
};
const DN = ["日","月","火","水","木","金","土"];

function getWeek(off) {
  const t = new Date(), dow = t.getDay();
  const mon = new Date(t);
  mon.setDate(t.getDate() - (dow === 0 ? 6 : dow - 1) + off * 7);
  return Array.from({length:6}, function(_, i) {
    const d = new Date(mon); d.setDate(mon.getDate() + i); return d;
  });
}

function dk(d) {
  const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  return jst.toISOString().slice(0, 10);
}

function fmtDate(d) { return (d.getMonth()+1) + "月" + d.getDate() + "日（" + DN[d.getDay()] + "）"; }
function fmtShort(d) { return (d.getMonth()+1) + "/" + d.getDate(); }
function fmtDow(d) { return DN[d.getDay()]; }
function isHol(k) { return !!HOLIDAYS[k]; }
function holName(k) { return HOLIDAYS[k] || ""; }
function memberName(m) { return typeof m === "string" ? m : m.name; }
function memberRoles(m) { return typeof m === "string" ? [] : (m.roles || []); }

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2500);
}

function q(s) {
  return s.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

// ---- シフト ----
window.renderWeek = function() {
  const days = getWeek(S.weekOffset);
  document.getElementById("week-label").textContent = fmtShort(days[0]) + " — " + fmtShort(days[5]);
  const grid = document.getElementById("week-grid");
  grid.innerHTML = "";
  days.forEach(function(d) {
    const key = dk(d), dow = d.getDay();
    const shift = S.shifts[key] || {};
    const names = (shift["出席"] && Array.isArray(shift["出席"])) ? shift["出席"] : [];
    const sel = S.selectedDate === key, sat = dow === 6, hol = isHol(key);
    const cell = document.createElement("div");
    cell.className = "day-cell" + (sel ? " selected" : hol ? " hol" : sat ? " sat" : "");
    let inner = "";
    if (hol && !sel) inner += "<div class='hol-dot'></div>";
    inner += "<span class='day-num'>" + d.getDate() + "</span>";
    inner += "<div class='dot-row'>" + names.slice(0,3).map(function() { return "<div class='dot'></div>"; }).join("") + "</div>";
    cell.innerHTML = inner;
    cell.onclick = function() { S.selectedDate = key; window.pendingRemove = {}; renderWeek(); renderDetail(); };
    grid.appendChild(cell);
  });
  renderDetail();
};

window.renderDetail = function() {
  const wrap = document.getElementById("detail-wrap");
  if (!S.selectedDate) { wrap.innerHTML = "<div class='no-select'>日付を選んでシフトを確認・編集</div>"; return; }
  const d = new Date(S.selectedDate + "T00:00:00");
  const shift = S.shifts[S.selectedDate] || {};
  const hol = holName(S.selectedDate);
  let html = "<div class='detail-panel'>";
  html += "<div class='detail-date'><div class='detail-date-icon'>📅</div>" + fmtDate(d) + "</div>";
  if (hol) html += "<div class='hol-label'>🎌 " + hol + "</div>";

  if (!S.roles.length) {
    html += "<div class='empty'>役割を登録してください</div>";
  } else {
    S.roles.forEach(function(role, ri) {
      const assigned = shift[role] || [];
      const isOpen = !!S.openCL[role];
      const eligible = S.members.filter(function(m) { return memberRoles(m).indexOf(role) >= 0; });
      html += "<div class='role-block'><div class='role-lbl'>" + role + "</div><div class='assigned-row'>";
      assigned.forEach(function(m) {
        html += "<span class='assigned-tag'>" + m;
        if (isAdmin) html += "<button class='rm-tag' onclick=\"requestRemoveMember('" + q(role) + "','" + q(m) + "')\">✕</button>";
        html += "</span>";
      });
      if (isAdmin) html += "<button class='add-btn' onclick=\"toggleCL('" + q(role) + "')\">" + (isOpen ? "▲ 閉じる" : "＋ 追加") + "</button>";
      html += "</div>";
      if (isOpen && isAdmin) {
        if (!eligible.length) {
          html += "<div class='no-eligible'>この役割にタグ付けされたメンバーがいません</div>";
        } else {
          html += "<div class='checklist'>";
          eligible.forEach(function(m) {
            const name = memberName(m);
            const checked = assigned.indexOf(name) >= 0;
            html += "<div class='check-item" + (checked ? " checked" : "") + "' onclick=\"toggleMember('" + q(role) + "','" + q(name) + "')\">";
            html += "<div class='check-box'>" + (checked ? "✓" : "") + "</div>";
            html += "<span class='check-name'>" + name + "</span></div>";
          });
          html += "</div>";
        }
      }
      html += "</div>";
      if (ri < S.roles.length - 1) html += "<div class='role-divider'></div>";
    });
  }

  const memo = shift["note"] || "";
  html += "<div class='role-divider'></div>";
  html += "<div class='role-block' style='margin-top:14px'>";
  html += "<div class='role-lbl'>備考</div>";
  if (isAdmin) {
    html += "<textarea class='memo-input' id='memo-input' placeholder='自由記載...'>" + memo + "</textarea>";
    html += "<button class='memo-save-btn' onclick='saveMemo()'>保存</button>";
  } else {
    html += memo ? "<div class='memo-text'>" + memo.split("\n").join("<br>") + "</div>" : "<span style='color:var(--text2);font-size:13px;font-style:italic'>記載なし</span>";
  }
  html += "</div></div>";
  wrap.innerHTML = html;
};

window.saveMemo = async function() {
  if (!isAdmin) return;
  const textarea = document.getElementById("memo-input");
  if (!textarea) { showToast("入力欄が見つかりません"); return; }
  if (!S.shifts[S.selectedDate]) S.shifts[S.selectedDate] = {};
  S.shifts[S.selectedDate]["note"] = textarea.value || "";
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  try {
    await setDoc(DATA_DOC, {members:S.members, roles:S.roles, shifts:S.shifts});
    showToast("備考を保存しました");
  } catch(e) { showToast("保存に失敗しました"); console.error(e); }
  startSync();
};

window.toggleCL = function(role) { S.openCL[role] = !S.openCL[role]; renderDetail(); };

window.toggleMember = function(role, member) {
  if (!isAdmin) return;
  if (!S.shifts[S.selectedDate]) S.shifts[S.selectedDate] = {};
  const arr = S.shifts[S.selectedDate][role] || [];
  const idx = arr.indexOf(member);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(member);
  S.shifts[S.selectedDate][role] = arr;
  window.saveData();
};

window.requestRemoveMember = function(role, member) {
  if (confirm(member + " を削除しますか？")) {
    window.toggleMember(role, member);
  }
};

window.changeWeek = function(dir) { S.weekOffset += dir; S.selectedDate = null; window.pendingRemove = {}; renderWeek(); };

// ---- 一覧 ----
window.renderSummary = function() {
  const days = getWeek(S.sumWeekOffset);
  document.getElementById("sum-week-label").textContent = fmtShort(days[0]) + " — " + fmtShort(days[5]);
  let html = "";
  days.forEach(function(d) {
    const key = dk(d), dow = d.getDay(), shift = S.shifts[key] || {};
    const allNames = (shift["出席"] && Array.isArray(shift["出席"])) ? shift["出席"].filter(function(n){ return n; }) : [];
    const isOpen = !!S.openSumDay[key], has = allNames.length > 0, sat = dow === 6, hol = isHol(key);
    const circCls = has ? "has" : hol ? "hol" : sat ? "sat" : "";
    const lblCls = hol ? "hol" : sat ? "sat" : "";
    html += "<div class='sum-card'>";
    html += "<div class='sum-card-header" + (isOpen ? " open" : "") + "' onclick=\"toggleSumDay('" + key + "')\">";
    html += "<div class='sum-date-wrap'>";
    html += "<div class='sum-date-circle " + circCls + "'>" + d.getDate() + "</div>";
    html += "<div><div class='sum-date-label " + lblCls + "'>" + fmtShort(d) + "（" + fmtDow(d) + "）" + (hol ? "<span class='hol-inline'>● " + holName(key) + "</span>" : "") + "</div>";
    html += "<div class='sum-date-sub'>" + (has ? "出席 " + allNames.length + "名" : "未登録") + "</div></div></div>";
    html += "<div class='sum-right'><span class='sum-badge " + (has ? "has-b" : "empty-b") + "'>" + (has ? "出席 " + allNames.length + "人" : "未登録") + "</span>";
    html += "<span class='chev'>" + (isOpen ? "▲" : "▼") + "</span></div></div>";
    if (isOpen) {
      const filled = S.roles.filter(function(r) { return (shift[r] || []).length; });
      html += "<div class='sum-body'>";
      if (!filled.length) {
        html += "<div class='sum-empty'>シフト未登録</div>";
      } else {
        filled.forEach(function(role) {
          html += "<div class='sum-row'><span class='sum-role'>" + role + "</span><div class='sum-names'>";
          (shift[role] || []).forEach(function(n) {
            const marked = (S.shifts[key] && S.shifts[key]["marked"]) ? S.shifts[key]["marked"] : [];
            const sp = marked.indexOf(n + "::" + role) >= 0;
            const cls = sp ? "sum-name-tag sum-pending-remove" : "sum-name-tag";
            html += "<span class='" + cls + "' data-dk='" + key + "' data-role='" + role + "' data-name='" + n + "' onclick='sumRequestRemove(this)'>" + n + "</span>";
          });
          html += "</div></div>";
        });
      }
      const memo = shift["note"] || "";
      if (memo) html += "<div class='sum-memo'>📝 " + memo.split("\n").join(" / ") + "</div>";
      html += "</div>";
    }
    html += "</div>";
  });
  document.getElementById("summary-list").innerHTML = html;
};

window.toggleSumDay = function(key) { S.openSumDay[key] = !S.openSumDay[key]; renderSummary(); };
window.changeSumWeek = function(dir) { S.sumWeekOffset += dir; S.openSumDay = {}; renderSummary(); };

window.sumRequestRemove = function(el) {
  if (!isAdmin) return;
  const dateKey = el.getAttribute("data-dk");
  const role = el.getAttribute("data-role");
  const member = el.getAttribute("data-name");
  const key = member + "::" + role;
  if (!S.shifts[dateKey]) S.shifts[dateKey] = {};
  const marked = S.shifts[dateKey]["marked"] || [];
  const idx = marked.indexOf(key);
  if (idx >= 0) {
    marked.splice(idx, 1);
  } else {
    marked.push(key);
  }
  S.shifts[dateKey]["marked"] = marked;
  window.saveData();
  renderSummary();
};

// ---- メンバー ----
window.renderMembers = function() {
  const el = document.getElementById("member-list");
  if (!S.members.length) { el.innerHTML = "<div class='empty'>メンバーが登録されていません</div>"; return; }
  let html = "<div class='list-items'>";
  S.members.forEach(function(m, i) {
    const name = memberName(m), mRoles = memberRoles(m);
    html += "<div class='list-item' draggable='true' ondragstart=\"dragStart(event,'members'," + i + ")\" ondragover=\"dragOver(event," + i + ")\" ondrop=\"dropItem(event,'members'," + i + ")\" ondragend='dragEnd(event)'>";
    html += "<div class='list-item-left'><div class='avatar'>" + name.slice(0,2) + "</div>";
    html += "<div class='member-info'><span class='list-item-name'>" + name + "</span>";
    html += "<div class='member-role-tags'>" + mRoles.map(function(r) { return "<span class='member-role-tag'>" + r + "</span>"; }).join("") + "</div>";
    html += "</div></div><div class='item-actions'>";
    html += "<button class='tag-btn' onclick='openRoleTag(" + i + ")' title='役割タグを編集'>🏷</button>";
    html += "<div class='order-btns'>";
    html += "<button class='order-btn' onclick=\"reorder('members'," + i + ",-1)\" " + (i===0?"disabled":"") + ">▲</button>";
    html += "<button class='order-btn' onclick=\"reorder('members'," + i + ",1)\" " + (i===S.members.length-1?"disabled":"") + ">▼</button>";
    html += "</div><button class='del-btn' onclick='removeMember(" + i + ")'>🗑</button>";
    html += "</div></div>";
  });
  el.innerHTML = html + "</div>";
};

window.openRoleTag = function(memberIdx) {
  const m = S.members[memberIdx], name = memberName(m), mRoles = memberRoles(m);
  document.getElementById("modal-member-name").textContent = name + "さんの役割";
  let html = "";
  if (!S.roles.length) {
    html = "<div class='empty'>役割が登録されていません</div>";
  } else {
    S.roles.forEach(function(role) {
      const checked = mRoles.indexOf(role) >= 0;
      html += "<div class='check-item" + (checked ? " checked" : "") + "' onclick=\"toggleRoleTag(" + memberIdx + ",'" + q(role) + "')\">";
      html += "<div class='check-box'>" + (checked ? "✓" : "") + "</div><span class='check-name'>" + role + "</span></div>";
    });
  }
  document.getElementById("modal-role-list").innerHTML = html;
  document.getElementById("role-tag-modal").style.display = "flex";
};

window.closeRoleTag = function() { document.getElementById("role-tag-modal").style.display = "none"; };

window.toggleRoleTag = function(memberIdx, role) {
  const m = S.members[memberIdx], mRoles = memberRoles(m);
  const idx = mRoles.indexOf(role);
  if (idx >= 0) mRoles.splice(idx, 1); else mRoles.push(role);
  if (typeof S.members[memberIdx] === "string") S.members[memberIdx] = {name: S.members[memberIdx], roles: mRoles};
  else S.members[memberIdx].roles = mRoles;
  window.saveData();
  openRoleTag(memberIdx);
};

window.addMember = function() {
  const inp = document.getElementById("new-member"), n = inp.value.trim();
  if (!n || S.members.some(function(m) { return memberName(m) === n; })) return;
  S.members.push({name:n, roles:[]}); inp.value = ""; window.saveData();
};
window.removeMember = function(i) { S.members.splice(i, 1); window.saveData(); };

// ---- 役割 ----
window.renderRoles = function() {
  const el = document.getElementById("role-list");
  if (!S.roles.length) { el.innerHTML = "<div class='empty'>役割が登録されていません</div>"; return; }
  let html = "<div class='list-items'>";
  S.roles.forEach(function(r, i) {
    const count = S.members.filter(function(m) { return memberRoles(m).indexOf(r) >= 0; }).length;
    html += "<div class='list-item' draggable='true' ondragstart=\"dragStart(event,'roles'," + i + ")\" ondragover=\"dragOver(event," + i + ")\" ondrop=\"dropItem(event,'roles'," + i + ")\" ondragend='dragEnd(event)'>";
    html += "<div class='list-item-left'><div class='role-icon'>🏷</div>";
    html += "<div><span class='list-item-name'>" + r + "</span><div class='role-member-count'>" + count + "名タグ付き</div></div></div>";
    html += "<div class='item-actions'><div class='order-btns'>";
    html += "<button class='order-btn' onclick=\"reorder('roles'," + i + ",-1)\" " + (i===0?"disabled":"") + ">▲</button>";
    html += "<button class='order-btn' onclick=\"reorder('roles'," + i + ",1)\" " + (i===S.roles.length-1?"disabled":"") + ">▼</button>";
    html += "</div><button class='del-btn' onclick='removeRole(" + i + ")'>🗑</button></div></div>";
  });
  el.innerHTML = html + "</div>";
};
window.addRole = function() {
  const inp = document.getElementById("new-role"), n = inp.value.trim();
  if (!n || S.roles.indexOf(n) >= 0) return;
  S.roles.push(n); inp.value = ""; window.saveData();
};
window.removeRole = function(i) { S.roles.splice(i, 1); window.saveData(); };

// ---- 並び替え ----
function moveItem(arr, i, dir) { const ni = i+dir; if(ni<0||ni>=arr.length) return; const tmp=arr[i]; arr[i]=arr[ni]; arr[ni]=tmp; }
window.reorder = function(type, i, dir) { moveItem(S[type], i, dir); window.saveData(); };
let dragSrc = {type:null, idx:null};
window.dragStart = function(e, type, i) { dragSrc = {type:type, idx:i}; e.currentTarget.classList.add("dragging"); };
window.dragOver = function(e, i) {
  e.preventDefault();
  document.querySelectorAll(".list-item").forEach(function(el) { el.classList.remove("drag-over"); });
  if (dragSrc.idx !== i) e.currentTarget.classList.add("drag-over");
};
window.dropItem = function(e, type, i) {
  e.preventDefault();
  document.querySelectorAll(".list-item").forEach(function(el) { el.classList.remove("drag-over"); el.classList.remove("dragging"); });
  if (dragSrc.type !== type || dragSrc.idx === i) return;
  const arr = S[type], item = arr.splice(dragSrc.idx, 1)[0]; arr.splice(i, 0, item); window.saveData();
};
window.dragEnd = function(e) {
  e.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".list-item").forEach(function(el) { el.classList.remove("drag-over"); });
};

// ---- タブ ----
const TITLES = {summary:"一覧", shift:"シフト", members:"メンバー", roles:"役割"};
const SUBS = {summary:"週ごとのシフト確認", shift:"日付を選んで割り当て", members:"スタッフの登録・管理", roles:"役割の登録・管理"};
window.switchTab = function(tab) {
  ["summary","shift","members","roles"].forEach(function(t) {
    document.getElementById("tab-" + t).classList.toggle("active", t === tab);
    document.getElementById("nav-" + t).classList.toggle("active", t === tab);
  });
  document.getElementById("page-title").textContent = TITLES[tab];
  document.getElementById("page-sub").textContent = SUBS[tab];
  if (tab === "members") renderMembers();
  if (tab === "roles") renderRoles();
  if (tab === "summary") { S.sumWeekOffset = S.weekOffset; renderSummary(); }
};
